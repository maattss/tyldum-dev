name: Performance Budget

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: performance-budget-${{ github.ref }}
  cancel-in-progress: true

# The workflows only read the repo; artifacts upload with their own token.
permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse Budget
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check i18n parity
        run: pnpm check:i18n

      - name: Lint
        run: pnpm lint

      - name: Build app
        run: pnpm build

      # After the build: `.next/types` must exist and match the installed
      # Next.js version for `tsc` to resolve the generated route types.
      - name: Typecheck
        run: pnpm typecheck

      - name: Run Lighthouse budgets
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
