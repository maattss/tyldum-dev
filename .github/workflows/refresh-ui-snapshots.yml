name: Refresh UI Snapshots

# Playwright baselines are platform specific. CI compares against the
# `chromium-linux` set, which cannot be regenerated on a macOS workstation.
# Run this workflow to produce them, then download the artifact and commit it.
on:
  workflow_dispatch:

# The workflows only read the repo; artifacts upload with their own token.
permissions:
  contents: read

jobs:
  refresh:
    name: Regenerate chromium-linux baselines
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Regenerate snapshots
        run: pnpm test:ui:update

      - name: Upload regenerated baselines
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chromium-linux-snapshots
          path: tests/ui-regression.spec.ts-snapshots/*-chromium-linux.png
          if-no-files-found: error
