name: UI Regression

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ui-regression-${{ github.ref }}
  cancel-in-progress: true

# The workflows only read the repo; artifacts upload with their own token.
permissions:
  contents: read

jobs:
  visual-regression:
    name: Playwright Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Check i18n parity
        run: pnpm check:i18n

      - name: Lint
        run: pnpm lint

      - name: Run visual regression tests
        run: pnpm test:ui

      # After the build: `.next/types` must exist and match the installed
      # Next.js version for `tsc` to resolve the generated route types.
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore
